project_id = "northstar-okr"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Northstar OKR is administrator-provisioned only: there is no public
# self-registration. Admin invite (`auth.admin.inviteUserByEmail`) still works
# with signup disabled. Must match the Authentication > Providers > Email
# setting in the Supabase Dashboard for the linked project.
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.admin-users]
verify_jwt = true

[functions.admin-invite-user]
verify_jwt = true

[functions.admin-resend-invite]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true
